name: Bilet Radari

on:
  schedule:
    - cron: "17 6 * * *"    # 09:17 İstanbul - günlük özet
    - cron: "17 15 * * *"   # 18:17 İstanbul - sadece yeni en düşük fiyatta mesaj
  workflow_dispatch:        # Actions sekmesinden elle çalıştırma düğmesi

permissions:
  contents: write

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fiyatlari tara
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python bilet_radar.py
      - name: Durumu kaydet
        run: |
          git config user.name "bilet-radar"
          git config user.email "bilet-radar@users.noreply.github.com"
          git add durum.json
          git diff --cached --quiet || git commit -m "Fiyat durumu guncellendi"
          git push
